services:
  mssql:
     image: mcr.microsoft.com/mssql/server:2025-CU1-ubuntu-22.04
     container_name: cineverse-mssql
     environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Cineverse123!
     ports:
      - "1435:1433"
     volumes:
      - mssql-data:/var/opt/mssql

  minio:
    image: minio/minio
    container_name: cineverse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio-data:/data
   
  seq:
   image: datalust/seq:latest
   container_name: seq
   environment:
    - ACCEPT_EULA=Y
    - SEQ_FIRSTRUN_ADMINPASSWORD=SeqAdmin123!
   ports:
    - "5341:80"
   volumes:
    - seq_data:/data
   restart: unless-stopped


volumes:
  mssql-data:
  minio-data:
  seq_data:
